name: Check for new jobs

on:
  schedule:
    # Runs every 20 minutes: 3 Adzuna API calls per run x 72 runs/day = 216
    # calls/day, safely under the free tier's 250/day cap (with room left
    # for manual test runs). Going more frequent than this risks hitting
    # the daily limit and silently missing checks later in the day.
    - cron: "*/20 * * * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab
    inputs:
      notify_all:
        description: "Send a notification for EVERY currently-open matching job, ignoring seen/baseline state (use for a one-time catch-up digest)"
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit seen_jobs.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job checker
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ALL: ${{ github.event.inputs.notify_all }}
        run: python job_alert.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
          git push
