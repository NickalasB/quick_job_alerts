name: Check for new jobs

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron can lag under load;
    # tighten to */10 if you want, but 15 is a good balance.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit seen_jobs.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve project paths
        run: |
          if [[ -f requirements.txt && -f job_alert.py && -f seen_jobs.json ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "SEEN_JOBS_FILE=seen_jobs.json" >> "$GITHUB_ENV"
          elif [[ -f .github/requirements.txt && -f .github/job_alert.py && -f .github/seen_jobs.json ]]; then
            echo "PROJECT_DIR=.github" >> "$GITHUB_ENV"
            echo "SEEN_JOBS_FILE=.github/seen_jobs.json" >> "$GITHUB_ENV"
          else
            echo "Could not find job alert files in either the repository root or .github/." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Run job checker
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python "$PROJECT_DIR/job_alert.py"

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add "$SEEN_JOBS_FILE"
          git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
          git push
